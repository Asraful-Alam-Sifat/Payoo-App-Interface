 <!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Login</title>

    <!-- Link TailwindCss & DaisyUI -->
   <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Add Font -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

<!-- Link Icons -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

 <!-- Favicon -->
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">

<style>
    *{
         font-family: "Outfit", sans-serif;
    }
    :root{
        --primary-border-color:#97979700;
        --primary-font-color:rgba(8, 8, 8, 0.5);;
    }
</style>
    
</head>
<body class="min-h-screen max-w-md mx-auto bg-base-300 ">

      <!-- Action Bar -->
    <section class=" flex justify-between border-y-2 border-gray-300 px-5 py-4 mt-5 sticky z-50 top-0 bg-base-100">
        <div class="logo flex justify-around gap-1.5 ">
            <div class="max-w-14">
            <img src="assets/logo.png" alt="logo-img">
            </div>
            <div class="balance-info">
                <h1 class="font-extrabold text-lg">$<span id="current-balance">45000</span></h1>
                <p class="text-(--primary-font-color) text-base font-normal">Available Balance</p>
            </div>
        </div>
        <a href="index.html" class="flex gap-1 border-2 border-gray-300 rounded-lg justify-center items-center py-3 px-4 text-(--primary-font-color) text-base font-normal "><img class="max-w-7 max-h-7" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAeCAYAAAA7MK6iAAAACXBIWXMAAAsTAAALEwEAmpwYAAABqElEQVR4nO2WO0skURBGO/UV+lo38AW7/0XMXf0FrkaO+flmujsYhsndDTT1reyKsSAiipEDaqixIj7WQF1RLlSDyKCX6WaYwA8u9KP6nq7qquoKgk81mqIo6paUk/RX0pmkO+CfpGNgU9IE8DUzYBzHnZLmgAdJzx+sR+A38CUVFOgFLt2mBl4ARtz1crncVCqVWgqFwjdJP4B5Sfdme5PP54dTgSWdA+vu2MO+H1g275+AyaCekpQD/jt4Ks9rkSWi8/zaJWZQT0laMfgvrweADkk7wFYacBiGA5Zwj1EU9fhAK/ame2nAtt+iZfpPX2jFnacFSxoz8EZVgziO24FDg7pu1BVkIKvzZ+CkqgFw4NGZqq3t98DFYrEtaSqNBY7fhDqr2gO+G/iosZKrGhzYDzIqJ0njPsYd9s13U0IHvRtIlgJWLXIz9YROG/Qqq57gBX31WxyqZQM3gVxIWgvDsM/DfjAJr4O6OSyr0WcJGLVJoxlotTods3sPSXhr8vTtsAfMJvOUx7A3k+k3BbqAKeAPcOrGW0m3riO55uDqtK4l86nAUy9rfNcaLs/hcQAAAABJRU5ErkJggg==" alt="logout-rounded-left">Log Out</a>
    </section>


   <header class=" pb-4 rounded-b-3xl bg-base-100">
    <!-- Banner section -->
     <section class=" mx-6 mb-6">
        <div class="banner-contant">
             <h1 class="font-bold text-2xl py-2">Welcome to Pay<span class="text-[#7460ffFF]">oo</span></h1>
        <p class="text-(--primary-font-color) py-4 font-normal text-base">Enjoy easy and convenient financial services with us. Cashout charge is low and</p>  
        </div>
     
        <div class="banner-card mt-6 grid grid-cols-3 grid-rows-2 gap-4">
            <button onclick="showOnly('add-money')" class="btn h-full flex-col  btn-primary btn-soft border-2 border-gray-300 rounded-xl py-5 text-center ">
            <img  class="mx-auto mb-1" src="assets/opt-1.png" alt=""> Add Money
            </button>

            <button onclick="showOnly('cashout-container')" class="btn h-full flex-col  btn-primary btn-soft border-2 border-gray-300 rounded-xl py-5 text-center">
                <img class="mx-auto mb-3" src="assets/opt-2.png" alt="">Cashout
            </button>

            <button onclick="showOnly('transfer-container')" class="btn h-full flex-col  btn-primary btn-soft border-2 border-gray-300 rounded-xl px-0 py-5 text-center">
               <img class="mx-auto mb-3" src="assets/opt-3.png" alt=""> Transfer Money
            </button>

            <button class="btn h-full flex-col  btn-primary btn-soft border-2 border-gray-300 rounded-xl py-5 text-center">
                <img class="mx-auto mb-3" src="assets/opt-4.png" alt="">Get Bonus
            </button>

            <button class="btn h-full flex-col  btn-primary btn-soft border-2 border-gray-300 rounded-xl py-5 text-center">
            <img class="mx-auto mb-3" src="assets/opt-5.png" alt="">Pay Bill
            </button>

            <button onclick="showOnly('history')" class="btn h-full flex-col  btn-primary btn-soft border-2 border-gray-300 rounded-xl py-5 text-center  justify-center items-center">
                <img class="mx-auto mb-3" src="assets/opt-6.png" alt="">Transactions
            </button>
           
        </div>
     </section>
</header>

<main>
    <!-- Add Money -->
    <section id="add-money" class=" w-11/12 mx-auto mt-5">
        <h1 class="font-bold text-lg">Add Money</h1>

          <div class="login-form mt-3">
        <div class="card bg-base-100 w-[400px] shrink-0 shadow mx-auto rounded-3xl ">
      <div class="card-body p-10">
        <fieldset class="fieldset">
            <label for="selectBank" class="label text-[#080808FF] font-semibold text-base mb-3">Select A Bank</label>
            <select id="select-bank" class="select select-neutral rounded-full font-normal text-base mb-3">
                   <option disabled selected>Select Bank</option>
                   <option>ICC Bank</option>
                   <option>UCC Bank</option>
                   <option>IFIC Bank</option>
            </select>

          <label for="account-num" class="label text-[#080808FF] font-medium text-base mb-3">Bank Account Number</label>
          <input id="account-num" maxlength="11" minlength="11" type="tel" class="appearance-none input rounded-full py-5 pl-5 border-none bg-base-300 font-normal text-base " placeholder="Enter 11 digit account number" />


          <label for="input-diposite" class="label text-[#080808FF] font-medium text-base mt-5 mb-3">Amount to Add</label>
          <input id="input-diposite" maxlength="11" minlength="11" type="tel" class="appearance-none input rounded-full py-5 pl-5 border-none bg-base-300 font-normal text-base " placeholder="Add Amount to withdraw" />


          <label for="pin-num" class="label text-[#080808FF] font-medium text-base mt-5 mb-3">Pin Number</label>
          <input id="pin-num" maxlength="4" minlength="4" type="password" class="input rounded-full py-5 pl-5 border-none bg-base-300 font-normal text-base" placeholder="Enter 4 digit pin number" />
       
          <button id="add-money-btn" class="btn btn-neutral mt-4 bg-primary border-none shadow-none rounded-full">Add Money</button>
        </fieldset>
      </div>
    </div>
      </div>
    </section>

<!-- CashOut -->
    <section id="cashout-container" class=" w-11/12 mx-auto mt-5">
        <h1 class="font-bold text-lg ">Cash Out</h1>

          <div class="login-form mt-3">
        <div class="card bg-base-100 w-[400px] shrink-0 shadow mx-auto rounded-3xl ">
      <div class="card-body p-10">
        <fieldset class="fieldset">
          <label class="label text-[#080808FF] font-medium text-base mb-3">Agent Number</label>
          <input id="agent-num" maxlength="11" minlength="11" type="tel" class="appearance-none input rounded-full py-5 pl-5 border-none bg-base-300 font-normal text-base " placeholder="Enter 11 digit number" />


          <label class="label text-[#080808FF] font-medium text-base mt-5 mb-3">Amount</label>
          <input id="input-withdraw" maxlength="11" minlength="11" type="tel" class="appearance-none input rounded-full py-5 pl-5 border-none bg-base-300 font-normal text-base " placeholder="Enter amount to withdraw" />


          <label class="label text-[#080808FF] font-medium text-base mt-5 mb-3">Pin Number</label>
          <input id="input-pin" maxlength="4" minlength="4" type="password" class="input rounded-full py-5 pl-5 border-none bg-base-300 font-normal text-base" placeholder="Enter 4 digit pin number" />
       
          <button id="withdraw-btn" class="btn btn-neutral mt-4 bg-primary border-none shadow-none rounded-full">Withdraw Money</button>
        </fieldset>
      </div>
    </div>
      </div>
    </section>

    <!-- Transfer Money -->
       <section id="transfer-container" class=" w-11/12 mx-auto mt-5">
        <h1 class="font-bold text-lg ">Transfer Money</h1>

          <div class="login-form mt-3">
        <div class="card bg-base-100 w-[400px] shrink-0 shadow mx-auto rounded-3xl ">
      <div class="card-body p-10">

        <fieldset class="fieldset">
          <label class="label text-[#080808FF] font-medium text-base mb-3">User Account Number</label>
          <input id="transfering-user-num" maxlength="11" minlength="11" type="tel" class="appearance-none input rounded-full py-5 pl-5 border-none bg-base-300 font-normal text-base " placeholder="Enter 11 digit number" />


          <label class="label text-[#080808FF] font-medium text-base mt-5 mb-3">Amount</label>
          <input id="transfer-amount" maxlength="11" minlength="11" type="tel" class="appearance-none input rounded-full py-5 pl-5 border-none bg-base-300 font-normal text-base " placeholder="Enter amount to Transfer" />


          <label class="label text-[#080808FF] font-medium text-base mt-5 mb-3">Pin Number</label>
          <input id="pin-for-transfer" maxlength="4" minlength="4" type="password" class="input rounded-full py-5 pl-5 border-none bg-base-300 font-normal text-base" placeholder="Enter 4 digit pin number" />
       
          <button id="transfer-btn" class="btn btn-neutral mt-4 bg-primary border-none shadow-none rounded-full">Transfer Money</button>
        </fieldset>

      </div>
    </div>
      </div>
    </section>



    <!-- Transaction -->
     <section id="history" class="w-11/12 mx-auto mt-5">
      <div class="flex justify-between">
        <h1 class="font-bold text-lg mb-6">Transactions History</h1>
        <a href="#history" class="text-(--primary-font-color)">View All</a>
      </div>
      
      <div id="history-container">

      </div>
     </section>
</main>

    
    <script src="Script/machin.js"></script>
    <script src="Script/diposit.js"></script>
    <script src="Script/cashOut.js"></script>
    <script src="Script/transfer.js"></script>
</body>
</html>
